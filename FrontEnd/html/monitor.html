<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GyAI 工业智能助手 - 实时监控">
    <title>实时监控 - GyAI 工业智能助手</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/monitor.css">
</head>
<body>
    <div class="monitor-page">
        <header class="monitor-header">
            <div class="header-left">
                <button class="header-action back-btn" id="backBtn" title="返回对话">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                </button>
                <h1 class="monitor-title">实时监控</h1>
            </div>
            <div class="header-right">
                <div class="camera-selector" id="cameraSelector">
                    <select class="camera-select" id="cameraSelect">
                        <option value="">检测摄像头中...</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="monitor-main">
            <div class="video-container" id="videoContainer">
                <div class="video-wrapper">
                    <video id="videoPreview" autoplay playsinline muted></video>
                    <canvas id="detectionCanvas" class="detection-canvas"></canvas>
                    <div class="video-overlay" id="videoOverlay">
                        <div class="overlay-content">
                            <div class="overlay-icon">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 7l-7 5 7 5V7z"/>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                                </svg>
                            </div>
                            <p class="overlay-text" id="overlayText">点击下方按钮启动摄像头</p>
                        </div>
                    </div>
                    <div class="video-info" id="videoInfo">
                        <span class="info-item" id="resolutionInfo">--</span>
                        <span class="info-item" id="fpsInfo">-- FPS</span>
                        <span class="info-item detection-status" id="detectionStatus"></span>
                    </div>
                    <div class="live-detection-results" id="liveDetectionResults"></div>
                    <div class="recording-indicator hidden" id="recordingIndicator">
                        <span class="recording-dot"></span>
                        <span class="recording-text">录制中</span>
                        <span class="recording-time" id="recordingTime">00:00</span>
                    </div>
                </div>
            </div>

            <div class="controls-panel">
                <div class="controls-section">
                    <h3 class="section-title">基本控制</h3>
                    <div class="control-buttons">
                        <button class="control-btn primary" id="startBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            <span>启动监控</span>
                        </button>
                        <button class="control-btn danger hidden" id="stopBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="6" y="6" width="12" height="12"/>
                            </svg>
                            <span>停止监控</span>
                        </button>
                        <button class="control-btn" id="screenshotBtn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <span>截图</span>
                        </button>
                        <button class="control-btn" id="recordBtn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            </svg>
                            <span>开始录制</span>
                        </button>
                        <button class="control-btn danger hidden" id="stopRecordBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="6" y="6" width="12" height="12"/>
                            </svg>
                            <span>停止录制</span>
                        </button>
                    </div>
                </div>

                <div class="controls-section collapsible-section">
                    <div class="section-header" id="aiControlHeader">
                        <h3 class="section-title">AI识别控制</h3>
                        <button class="collapse-btn" id="aiControlCollapseBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    </div>
                    <div class="section-content collapsed" id="aiControlContent">
                        <div class="detection-controls">
                            <div class="detection-mode-selector">
                                <label class="mode-option">
                                    <input type="radio" name="detectionMode" value="single" checked>
                                    <span class="mode-label">单模型识别</span>
                                </label>
                                <label class="mode-option">
                                    <input type="radio" name="detectionMode" value="multi">
                                    <span class="mode-label">多模型同时识别</span>
                                </label>
                            </div>
                            
                            <div class="model-selection" id="modelSelection">
                                <div class="single-model-select" id="singleModelSelect">
                                    <label class="setting-label">选择检测模型</label>
                                    <select class="setting-select" id="modelSelect">
                                        <option value="">加载模型中...</option>
                                    </select>
                                </div>
                                
                                <div class="multi-model-select hidden" id="multiModelSelect">
                                    <label class="setting-label">选择检测模型（可多选）</label>
                                    <div class="model-checkboxes" id="modelCheckboxes">
                                    </div>
                                    <button class="control-btn select-all-btn" id="selectAllModels">
                                        <span>全选/取消全选</span>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="detection-actions">
                                <button class="control-btn primary" id="startDetectionBtn" disabled>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8"/>
                                        <path d="m21 21-4.35-4.35"/>
                                    </svg>
                                    <span>开始识别</span>
                                </button>
                                <button class="control-btn danger hidden" id="stopDetectionBtn">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="6" y="6" width="12" height="12"/>
                                    </svg>
                                    <span>停止识别</span>
                                </button>
                            </div>
                            
                            <div class="detection-settings">
                                <div class="setting-item">
                                    <label class="setting-label">识别置信度</label>
                                    <div class="slider-container">
                                        <input type="range" class="confidence-slider" id="confidenceSlider" min="0.1" max="0.9" step="0.1" value="0.3">
                                        <span class="slider-value" id="confidenceValue">0.3</span>
                                    </div>
                                </div>
                                <div class="setting-item">
                                    <label class="setting-label">识别间隔(ms)</label>
                                    <div class="slider-container">
                                        <input type="range" class="interval-slider" id="intervalSlider" min="100" max="1000" step="100" value="300">
                                        <span class="slider-value" id="intervalValue">300</span>
                                    </div>
                                </div>
                                <div class="setting-item">
                                    <label class="setting-label">显示识别框</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="showBoxesToggle" checked>
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="setting-item">
                                    <label class="setting-label">显示标签</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="showLabelsToggle" checked>
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="setting-item">
                                    <label class="setting-label">保存检测结果</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="saveResultsToggle">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controls-section">
                    <h3 class="section-title">画质设置</h3>
                    <div class="quality-settings">
                        <div class="setting-item">
                            <label class="setting-label">分辨率</label>
                            <select class="setting-select" id="resolutionSelect">
                                <option value="auto">自动</option>
                                <option value="4K">4K (3840x2160)</option>
                                <option value="1080p" selected>1080p (1920x1080)</option>
                                <option value="720p">720p (1280x720)</option>
                                <option value="480p">480p (854x480)</option>
                                <option value="360p">360p (640x360)</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label class="setting-label">帧率</label>
                            <select class="setting-select" id="fpsSelect">
                                <option value="auto">自动</option>
                                <option value="60">60 FPS</option>
                                <option value="30" selected>30 FPS</option>
                                <option value="24">24 FPS</option>
                                <option value="15">15 FPS</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label class="setting-label">镜像翻转</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="mirrorToggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="controls-section">
                    <h3 class="section-title">设备信息</h3>
                    <div class="device-info" id="deviceInfo">
                        <div class="info-row">
                            <span class="info-label">摄像头状态</span>
                            <span class="info-value" id="cameraStatus">未连接</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">设备名称</span>
                            <span class="info-value" id="deviceName">--</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">当前分辨率</span>
                            <span class="info-value" id="currentResolution">--</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">编码格式</span>
                            <span class="info-value" id="codecInfo">--</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">识别状态</span>
                            <span class="info-value" id="aiStatus">未启动</span>
                        </div>
                    </div>
                </div>
                
                <div class="controls-section collapsible-section">
                    <div class="section-header" id="historyHeader">
                        <h3 class="section-title">检测历史</h3>
                        <button class="collapse-btn" id="historyCollapseBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    </div>
                    <div class="section-content collapsed" id="historyContent">
                        <div class="history-controls">
                            <select class="setting-select" id="historyModelFilter">
                                <option value="">全部模型</option>
                            </select>
                            <button class="control-btn small-btn" id="refreshHistoryBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                                    <path d="M21 3v5h-5"/>
                                </svg>
                            </button>
                            <button class="control-btn small-btn danger" id="clearHistoryBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                        <div class="history-list" id="historyList">
                            <div class="no-history">暂无检测历史</div>
                        </div>
                        <div class="history-pagination" id="historyPagination">
                            <button class="control-btn small-btn" id="prevPageBtn" disabled>上一页</button>
                            <span class="page-info" id="pageInfo">1/1</span>
                            <button class="control-btn small-btn" id="nextPageBtn" disabled>下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div class="toast-container" id="toastContainer"></div>
        
        <div class="warning-banner hidden" id="warningBanner">
            <div class="warning-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <div class="warning-content">
                <span class="warning-title" id="warningTitle">警告</span>
                <span class="warning-message" id="warningMessage"></span>
            </div>
            <button class="warning-close" id="warningClose">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="../js/utils/theme.js"></script>
    <script src="../js/components/monitor.js"></script>
</body>
</html>
